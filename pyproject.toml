[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-sc"
version = "0.1.0"
description = "Projection-based interaction scoring between biological signals in single-cell data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.16.3",
    "scanpy>=1.11.5",
    "anndata>=0.12.6",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "sift-sc>=0.1.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=14.0.1"]
dev = ["pytest>=9.0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crisp*"]
